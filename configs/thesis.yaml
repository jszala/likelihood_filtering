      sensor_locations: [0.009091, 0.018182, 0.027273, 0.036364, 0.045455, 0.054545, 0.063636, 0.072727, 0.081818, 0.090909]
      dimensions: 20
      domain_length: 0.1
      coefficient: 1.0
      scale: 3.0
      shift: 0.0
      observation_std: 0.282842712474619
      evaluation_rule: right
    time: {dt: 0.01, steps: 5000}
    replicates: 20
    filter: {ensemble_size: 200}
