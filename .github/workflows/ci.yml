name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - run: likelihood-filter run configs/quick.yaml --output runs/quick
      - run: python -m likelihood_filtering.benchmark --config configs/benchmark.yaml --output runs/benchmark-smoke --smoke
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m likelihood_filtering.comparison --output runs/comparison-smoke --smoke --workers 2
